# The release binary bakes build paths into symbols and panic strings — 0.3.29 named this Mac's
# home directory 587 times and 0.3.30 still named it once, inside a public download. Remap the whole
# home at compile time so every build from this repo is clean, whoever runs it and however it is
# launched. One rule, because two subfolder rules left .rustup and anything else under the home
# untouched. Panic messages themselves are unchanged; only the prefix differs. A prefix that does
# not exist on the build machine simply never matches.
[build]
rustflags = ["--remap-path-prefix=/build=/build"]

# The test binary links Sparkle through the shim but is not inside a bundle, so dyld needs the
# vendored framework here instead of at @executable_path/../Frameworks. `relative = true` resolves
# against the folder holding .cargo — this repo's is at the root, so the value keeps src-tauri/ (INTEGRATION.md §3A).
[env]
DYLD_FRAMEWORK_PATH = { value = "src-tauri/vendor/khsparkle", relative = true }
