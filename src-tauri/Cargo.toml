[package]
name = "relay-studio-kh"
version = "0.3.12"
edition = "2021"
publish = false

[lib]
name = "relay_studio_kh"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# dup2 for Chrome's remote-debugging-pipe (fd 3/4); already in the dependency tree.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
# Smallest AppKit binding for PID-targeted activation of an already-running Chrome profile.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSRunningApplication", "libc"] }
